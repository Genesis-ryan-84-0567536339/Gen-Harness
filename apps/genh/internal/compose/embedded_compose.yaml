# Gen-Harness — `docker compose -f deploy/compose.yaml --env-file .env up -d` (hoặc `make up`).
# Chỉ proxy mở cổng ra ngoài (8443). Bí mật: khoá master nằm ở ./secrets/gh_master_key (Docker secret).
name: gen-harness

# GH_DATABASE_URL/GH_ADMIN_DATABASE_URL KHÔNG nằm ở đây — mỗi service cần
# một vai trò DB khác nhau (xem docs/reports/HANDOFF-v0.1.1.md mục "Hợp đồng
# chung"): api/worker dùng role gh_app hạn quyền (RLS mới có hiệu lực),
# migrate dùng superuser (DDL + tạo/ALTER role gh_app) — mỗi service tự khai
# hai biến này trong "environment:" của chính nó, đè lên anchor này qua
# "<<: *app-env".
x-app-env: &app-env
  GH_ENV: ${GH_ENV:-production}
  GH_PUBLIC_URL: ${GH_PUBLIC_URL:-https://localhost:8443}
  GH_REDIS_URL: redis://redis:6379/0
  GH_OBJECTS_DIR: /var/lib/gh/objects
  GH_MASTER_KEY_FILE: /run/secrets/gh_master_key
  GH_BRIDGE_KEY_FILE: /run/secrets/gh_bridge_key
  GH_SETUP_TOKEN: ${GH_SETUP_TOKEN:-}
  # Khoá mã hoá riêng cho backup (khác GH_MASTER_KEY) — sinh ở Bước 4
  # (secretgen.Bundle.BackupKey, hex 64 ký tự), agent Python (gh/backup.py)
  # dùng để mã hoá bytes backup độc lập với khoá master của máy.
  GH_BACKUP_KEY: ${GH_BACKUP_KEY:-}

services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["${GH_PORT:-8443}:8443"]
    environment:
      GH_SITE_ADDRESS: ${GH_SITE_ADDRESS:-localhost}
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }

  web:
    build: { context: .., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 3s
      retries: 5

  migrate:
    build: { context: .., dockerfile: deploy/images/api.Dockerfile }
    command: ["alembic", "upgrade", "heads"]
    environment:
      <<: *app-env
      # migrate CẦN quyền superuser để chạy DDL — KHÁC api/worker (đã đổi
      # sang role gh_app hạn quyền, xem GH_DATABASE_URL của hai service đó
      # bên dưới).
      GH_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-gh}:${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD trong .env}@db:5432/${POSTGRES_DB:-gen_harness}
      # Mật khẩu role gh_app — migration 0014 tạo/ALTER role này bằng giá
      # trị ở đây (thiếu thì migration tự tạo role NOLOGIN + cảnh báo, không
      # lỗi — xem docs/reports/HANDOFF-v0.1.1.md).
      GH_APP_DB_PASSWORD: ${GH_APP_DB_PASSWORD:?đặt GH_APP_DB_PASSWORD trong .env}
    secrets: [gh_master_key]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: .., dockerfile: deploy/images/api.Dockerfile }
    restart: unless-stopped
    environment:
      <<: *app-env
      # api/worker kết nối bằng role gh_app (không phải superuser, không
      # BYPASSRLS) để RLS thật sự có hiệu lực — xem migration 0014.
      GH_DATABASE_URL: postgresql+asyncpg://gh_app:${GH_APP_DB_PASSWORD:?đặt GH_APP_DB_PASSWORD trong .env}@db:5432/${POSTGRES_DB:-gen_harness}
      # Superuser dự phòng cho backup/bảo trì phân vùng
      # (Settings.admin_database_url) — rỗng thì code tự dùng GH_DATABASE_URL.
      GH_ADMIN_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-gh}:${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD trong .env}@db:5432/${POSTGRES_DB:-gen_harness}
    secrets: [gh_master_key, gh_bridge_key]
    volumes:
      - agy_state:/var/lib/gh/agy
      - gh_objects:/var/lib/gh/objects
      # Hộp thư Console ↔ genh trên máy chủ (<gốc cài đặt>/run, genh tạo sẵn 0777):
      # phiên bản đang chạy, yêu cầu "Cập nhật ngay", trạng thái cập nhật.
      - ../run:/var/lib/gh/host
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    build: { context: .., dockerfile: deploy/images/api.Dockerfile }
    command: ["arq", "gh.worker.WorkerSettings"]
    restart: unless-stopped
    environment:
      <<: *app-env
      GH_DATABASE_URL: postgresql+asyncpg://gh_app:${GH_APP_DB_PASSWORD:?đặt GH_APP_DB_PASSWORD trong .env}@db:5432/${POSTGRES_DB:-gen_harness}
      GH_ADMIN_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-gh}:${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD trong .env}@db:5432/${POSTGRES_DB:-gen_harness}
    secrets: [gh_master_key, gh_bridge_key]
    # nocopy + chờ api: volume mới tinh được Docker chép nội dung ảnh
    # (/var/lib/gh/agy/.gemini/…, quyền gh) vào lần mount đầu. api và worker
    # tạo cùng lúc thì cả hai cùng chép → "mkdir …: file exists" (e2e release
    # v0.1.8). Chỉ api chép; worker mount sau, không chép.
    volumes:
      - { type: volume, source: agy_state, target: /var/lib/gh/agy, volume: { nocopy: true } }
      - { type: volume, source: gh_objects, target: /var/lib/gh/objects, volume: { nocopy: true } }
    healthcheck:
      test: ["CMD", "arq", "--check", "gh.worker.WorkerSettings"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      api: { condition: service_started }

  bridge:
    build: { context: .., dockerfile: deploy/images/bridge.Dockerfile }
    restart: unless-stopped
    environment:
      GH_REDIS_URL: redis://redis:6379/0
      GH_BRIDGE_KEY_FILE: /run/secrets/gh_bridge_key
    # Bridge chỉ nhận khoá bridge (ký permit, mã hoá phiên khi truyền) — không bao giờ nhận khoá master.
    secrets: [gh_bridge_key]
    depends_on:
      redis: { condition: service_healthy }

  db:
    build: { context: .., dockerfile: deploy/images/db.Dockerfile }
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: ${POSTGRES_DB:-gen_harness}
    # Tinh chỉnh từ RAM máy (genh tính ở apps/genh/internal/pgtune, truyền
    # qua GH_PG_* trong overlay môi trường khi gọi `docker compose`) — mặc
    # định an toàn dưới đây dùng khi chạy `docker compose` tay, không qua
    # genh (vd `make up`), hoặc trên máy chưa dò được RAM.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - shared_buffers=${GH_PG_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${GH_PG_EFFECTIVE_CACHE_SIZE:-768MB}
      - -c
      - work_mem=${GH_PG_WORK_MEM:-4MB}
      - -c
      - maintenance_work_mem=${GH_PG_MAINTENANCE_WORK_MEM:-64MB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

secrets:
  gh_master_key:
    file: ../secrets/gh_master_key
  gh_bridge_key:
    file: ../secrets/gh_bridge_key

volumes:
  caddy_data:
  pg_data:
  redis_data:
  gh_objects:
  agy_state:
