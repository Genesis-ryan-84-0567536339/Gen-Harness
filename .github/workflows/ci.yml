name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  # v0.1.33 (F-9) — release.yml gọi lại CHÍNH workflow này thành job `ci` và đưa vào `needs` của bước phát
  # hành: bản thử (prerelease) chỉ được tạo khi toàn bộ CI ở đây xanh trên đúng commit sắp phát hành.
  workflow_call:
    inputs:
      from_release:
        type: boolean
        required: false
        default: false
        description: "true khi release.yml gọi"

# Bẫy F-9 bước 5: khi được gọi qua workflow_call, context `github` là của workflow GỌI (release.yml: event
# push, ref main) → nhóm cũ `ci-${{ github.ref }}` trùng với lượt CI do chính lần push main đó kích hoạt ⇒
# hai bên huỷ lẫn nhau (Release mất job `ci`, cổng phát hành không bao giờ xanh). Ngoài ra concurrency với
# cancel-in-progress=false vẫn chỉ giữ MỘT lượt chờ (lượt chờ cũ bị huỷ khi có lượt mới), nên lượt gọi từ
# Release phải có nhóm riêng theo sha + run_id và không huỷ ai. Khi push/PR, `inputs` rỗng ⇒ hành vi cũ:
# nhóm theo workflow + event + ref, lượt mới huỷ lượt cũ.
concurrency:
  group: ${{ inputs.from_release && format('ci-release-{0}-{1}', github.sha, github.run_id) || format('ci-{0}-{1}-{2}', github.workflow, github.event_name, github.ref) }}
  cancel-in-progress: ${{ !inputs.from_release }}

jobs:
  # ── version ──────────────────────────────────────────────────────────────
  # Kiểm nhanh tệp VERSION ở gốc repo đúng định dạng — job meta của
  # release.yml đọc CHÍNH tệp này để tự phát hành khi merge vào main (xem
  # docs/handoff/05-installer.md mục "Phát hành"); VERSION sai định dạng
  # phải fail ngay ở PR, không để tới lúc release.yml chạy trên main mới
  # phát hiện.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm VERSION đúng định dạng vMAJOR.MINOR.PATCH[-PRERELEASE]
        run: |
          set -euo pipefail
          if [ ! -f VERSION ]; then
            echo "::error::thiếu tệp VERSION ở gốc repo" >&2
            exit 1
          fi
          version="$(tr -d '[:space:]' <VERSION)"
          if ! printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::VERSION không đúng định dạng vMAJOR.MINOR.PATCH[-PRERELEASE]: '$version'" >&2
            exit 1
          fi
          echo "VERSION hợp lệ: $version"
      # v0.1.33 (F-9) — cổng phát hành: script bất biến do gói cong-phat-hanh tạo, kiểm các điều kiện để một
      # bản chỉ thành bản thử (prerelease) rồi mới được nâng thành bản chính thức (latest) sau E2E cài thật.
      - name: Kiểm cổng phát hành
        run: python3 .github/scripts/check_release_gate.py
      - name: Test script kiểm cổng phát hành (gỡ từng mắt xích → phải bắt được)
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

  api:
    runs-on: ubuntu-latest
    # Hai lượt pytest đầy đủ (superuser + gh_app) + build image db + e2e thật rút gọn (v0.1.35, F-14) — chặn treo
    # vô hạn nếu test kẹt.
    timeout-minutes: 48
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL 16 + pgvector + pg_partman (cùng image với compose)
        run: |
          docker build -f deploy/images/db.Dockerfile -t gh-db .
          docker run -d --name db -p 5432:5432 -e POSTGRES_PASSWORD=postgres gh-db
          for _ in $(seq 1 30); do docker exec db pg_isready -U postgres && break; sleep 2; done
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.11" }
      - name: Cài phụ thuộc
        working-directory: apps/api
        run: uv venv .venv && uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Lint + typecheck
        working-directory: apps/api
        run: .venv/bin/ruff check gh tests && .venv/bin/mypy gh
      # v0.1.33 (F-13) — tests/conftest.py và container migrate chạy `alembic upgrade heads` (số nhiều) nên tự
      # nó che lỗi nhiều head (thứ tự migrate không xác định, gh/bundle.py so revision sai). `alembic heads` chỉ
      # đọc thư mục migrations, không chạy env.py ⇒ không cần DB. Chốt chặn thứ hai: tests/test_migrations_heads.py.
      - name: Kiểm alembic chỉ có đúng 1 head
        working-directory: apps/api
        run: |
          set -euo pipefail
          heads="$(.venv/bin/alembic heads)"
          echo "$heads"
          n=$(printf '%s\n' "$heads" | grep -c '(head)' || true)
          [ "$n" -eq 1 ] || { echo "::error::alembic có $n head — phải gộp bằng 'alembic merge' để chỉ còn 1" >&2; exit 1; }
      - name: Test (Postgres + Redis thật)
        working-directory: apps/api
        env:
          GH_TEST_PG: postgresql://postgres:postgres@localhost:5432
          GH_TEST_REDIS: redis://localhost:6379/15
        run: .venv/bin/pytest -q
      # v0.1.33 (F-13) — chạy lại TOÀN BỘ bộ test dưới role ứng dụng gh_app (không superuser, không BYPASSRLS —
      # migration 0014), giống `make api-test-app-role`, để GRANT còn thiếu lộ ra ở CI chứ không phải trên máy
      # Boss. CSDL mẫu riêng (GH_TEST_TEMPLATE) để không đè lên CSDL mẫu của lượt trên.
      - name: Test dưới role ứng dụng gh_app (GH_TEST_APP_ROLE=1)
        working-directory: apps/api
        env:
          GH_TEST_PG: postgresql://postgres:postgres@localhost:5432
          GH_TEST_REDIS: redis://localhost:6379/15
          GH_TEST_APP_ROLE: "1"
          GH_TEST_TEMPLATE: gh_test_template_app
        run: .venv/bin/pytest -q
      # v0.1.35 (F-14) — e2e THẬT rút gọn: api + worker thật trên đúng Postgres (image gh-db) + Redis của job này,
      # bridge giả + model giả, Chromium thật bấm 4 luồng giao/gán (Hộp thư, Vụ việc, BOT nhóm, Gen đề xuất). Bắt lỗi
      # kiểu "mock xanh, máy thật hỏng" (id viết cứng, hợp đồng API lệch) — xem docs/reports/phase-5-e2e-live.md.
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - name: Cài phụ thuộc web (npm ci ở gốc repo)
        run: npm ci
      - name: Phiên bản Playwright (khoá cache trình duyệt)
        id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache trình duyệt Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Cài Chromium cho Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Công cụ CSDL/Redis cho e2e thật (psql, redis-cli)
        run: |
          set -euo pipefail
          pkgs=()
          command -v psql >/dev/null || pkgs+=(postgresql-client)
          command -v redis-cli >/dev/null || pkgs+=(redis-tools)
          if [ "${#pkgs[@]}" -gt 0 ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq "${pkgs[@]}"
          fi
          psql --version && redis-cli --version
      - name: E2E thật rút gọn (4 luồng giao/gán + Gen)
        working-directory: apps/web
        timeout-minutes: 8
        env:
          LIVE_SPECS: live-ci
          GH_LIVE_PG: postgresql://postgres:postgres@localhost:5432
        run: bash e2e-live/run.sh
      - name: Lưu ảnh + vết e2e thật khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-live-${{ github.run_attempt }}
          path: |
            apps/web/test-results/live-shots
            apps/web/test-results/live
          retention-days: 7
          if-no-files-found: ignore

  # v0.1.29 — browser-worker (apps/browser): Chromium thật trên TRANG MẪU (không gọi facebook.com), Redis thật.
  browser:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.11" }
      - name: Cài phụ thuộc + Chromium của Playwright
        working-directory: apps/browser
        run: |
          uv venv .venv && uv pip install --python .venv/bin/python -e ".[dev]"
          .venv/bin/playwright install --with-deps chromium
      - name: Lint + typecheck
        working-directory: apps/browser
        run: .venv/bin/ruff check ghb tests && .venv/bin/mypy ghb
      - name: Cho phép user namespace không đặc quyền (Ubuntu 24.04 chặn bằng AppArmor — F-85)
        # Máy Fedora của Sếp không chặn; runner Ubuntu 24.04 chặn mặc định. Không bật được thì `|| true` rồi test
        # GH_BROWSER_SANDBOX_REQUIRED=1 đỏ — đó là mục đích (không giả xanh).
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Test (Chromium + Redis thật, trang mẫu)
        working-directory: apps/browser
        env:
          GH_TEST_REDIS: redis://localhost:6379/14
          GH_BROWSER_TESTS_REQUIRED: "1"
          GH_BROWSER_SANDBOX_REQUIRED: "1"
        run: .venv/bin/pytest -q

  web:
    runs-on: ubuntu-latest
    # Playwright (mock) gồm cả so ảnh với thiết kế (visual.spec.ts) — chặn treo vô hạn nếu dev server kẹt.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run -w apps/web lint
      # v0.1.35 (F-1) — script do gói f1 tạo: chặn id giả viết cứng (vd 'u-lan', 'agent-tls') lọt lại vào mã web.
      - name: Cấm ID giả viết cứng trong apps/web/src (F-1)
        run: python3 .github/scripts/check_no_fake_ids.py apps/web/src
      - run: npm run -w apps/web typecheck
      - run: npm run -w apps/web test
      - run: npm run -w apps/web build
      - run: npm run -w apps/bridge test
      # v0.1.33 (F-13) — bộ e2e mock (apps/web/e2e) trước đây chỉ chạy tay. playwright.config.ts tự dựng
      # `vite --mode mock`; GitHub đặt CI=true ⇒ không dùng lại server có sẵn.
      - name: Cài Chromium cho Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Playwright (mock)
        run: npm run -w apps/web test:e2e
      - name: Lưu báo cáo Playwright khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore

  images:
    runs-on: ubuntu-latest
    needs: [api, web, browser]
    steps:
      - uses: actions/checkout@v4
      - name: Build image api/worker, bridge, web, db, browser
        run: |
          docker build --build-arg VERSION="$(tr -d '[:space:]' < VERSION)" -f deploy/images/api.Dockerfile -t gh-api .
          docker build -f deploy/images/browser.Dockerfile -t gh-browser .
          docker build -f deploy/images/bridge.Dockerfile -t gh-bridge .
          docker build -f apps/web/Dockerfile -t gh-web .
          docker build -f deploy/images/db.Dockerfile -t gh-db .
      - name: Sandbox Chromium bật trong container browser với đúng tuỳ chọn bảo mật như compose (F-85)
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          python3 -c "import json;d=json.load(open('deploy/browser/chromium-seccomp.json'));assert d['defaultAction']"
          out="$(docker run --rm --init --user pwuser --cap-drop ALL \
            --security-opt no-new-privileges:true --security-opt "seccomp=$PWD/deploy/browser/chromium-seccomp.json" \
            --read-only --tmpfs /tmp:size=768m --shm-size 256m \
            -e GH_BROWSER_SANDBOX=auto -e GH_BROWSER_HEADLESS=0 \
            gh-browser xvfb-run -a python3 -m ghb.sandbox --probe)"
          echo "$out"
          echo "$out" | tail -n 1 | python3 -c "
          import json,sys
          r=json.loads(sys.stdin.read())
          assert r['enabled'] is True, 'Chromium trong container browser KHÔNG bật được sandbox: %s' % r
          print('OK: sandbox bật trong container (không root, cap_drop ALL, seccomp riêng)')"
      - name: Ảnh api mang đúng phiên bản (v0.1.36 F-46)
        run: |
          want="$(tr -d '[:space:]' < VERSION)"
          got="$(docker run --rm --entrypoint python gh-api -c 'import gh;print(gh.__version__)')"
          label="$(docker inspect gh-api --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          echo "VERSION=$want gh.__version__=$got label=$label"
          if [ "$got" != "$want" ]; then echo "::error::gh.__version__ trong ảnh là '$got', VERSION là '$want'"; exit 1; fi
          if [ "$label" != "$want" ]; then echo "::error::LABEL org.opencontainers.image.version là '$label', VERSION là '$want'"; exit 1; fi
      - name: Kiểm tra compose
        run: |
          cp .env.example .env && mkdir -p secrets
          python3 -c "import os,base64;print(base64.b64encode(os.urandom(32)).decode())" > secrets/gh_master_key
          python3 -c "import os,base64;print(base64.b64encode(os.urandom(32)).decode())" > secrets/gh_bridge_key
          python3 -c "import os,base64;print(base64.b64encode(os.urandom(32)).decode())" > secrets/gh_browser_key
          docker run --rm --entrypoint agy gh-api --version
          docker run --rm --init --read-only --tmpfs /tmp --cap-drop ALL gh-browser python3 -c "import ghb.worker, ghb.egress"
          docker compose -f deploy/compose.yaml --env-file .env config -q
      - name: Cổng proxy mặc định chỉ nghe 127.0.0.1 (v0.1.46 F-27)
        run: |
          set -euo pipefail
          # Dùng .env do bước "Kiểm tra compose" tạo; GH_BIND_ADDR lấy từ môi trường (không có trong .env.example).
          got="$(env -u GH_BIND_ADDR docker compose -f deploy/compose.yaml --env-file .env config --format json | jq -r '.services.proxy.ports[0].host_ip')"
          echo "host_ip mặc định: $got"
          [ "$got" = "127.0.0.1" ] || { echo "::error::cổng proxy mặc định phải là 127.0.0.1 (đang '$got') — kiểm GH_BIND_ADDR trong deploy/compose.yaml" >&2; exit 1; }
          got="$(GH_BIND_ADDR=0.0.0.0 docker compose -f deploy/compose.yaml --env-file .env config --format json | jq -r '.services.proxy.ports[0].host_ip')"
          echo "host_ip với GH_BIND_ADDR=0.0.0.0: $got"
          [ "$got" = "0.0.0.0" ] || { echo "::error::GH_BIND_ADDR=0.0.0.0 phải cho host_ip 0.0.0.0 (đang '$got')" >&2; exit 1; }
      - name: Caddyfile hợp lệ với 3 giá trị GH_SITE_ADDRESS (v0.1.46 F-27)
        run: |
          set -euo pipefail
          validate() {
            docker run --rm "$@" -v "$PWD/deploy/proxy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine \
              caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile
          }
          echo "== GH_SITE_ADDRESS chưa đặt (mặc định 127.0.0.1)"
          validate
          for addr in gen-harness.tail1234.ts.net 192.168.1.20; do
            echo "== GH_SITE_ADDRESS=$addr"
            validate -e "GH_SITE_ADDRESS=$addr"
          done

  # ── ci-ok ────────────────────────────────────────────────────────────────
  # v0.1.33 (F-9/F-13) — job tổng: required check DUY NHẤT của branch protection. Luôn chạy (if: always(),
  # không lọc đường dẫn) để PR chỉ sửa tài liệu không kẹt "Expected — waiting"; đỏ khi BẤT KỲ job nào phía
  # trên failure/cancelled/skipped (skipped tính là đỏ: job bị bỏ qua vì job trước nó hỏng thì không được
  # coi là xanh). Thêm job mới vào ci.yml thì nhớ thêm vào `needs` dưới đây.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    needs: [version, api, browser, web, images]
    if: always()
    steps:
      - name: Tổng hợp kết quả các job CI
        env:
          R_VERSION: ${{ needs.version.result }}
          R_API: ${{ needs.api.result }}
          R_BROWSER: ${{ needs.browser.result }}
          R_WEB: ${{ needs.web.result }}
          R_IMAGES: ${{ needs.images.result }}
          NOT_GREEN: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "version=$R_VERSION api=$R_API browser=$R_BROWSER web=$R_WEB images=$R_IMAGES"
          if [ "$NOT_GREEN" = "true" ]; then
            echo "::error::CI chưa xanh: có job failure/cancelled/skipped (xem dòng 'version=… api=…' của bước này) — mở job đỏ, sửa lỗi rồi đẩy lại hoặc bấm Re-run." >&2
            exit 1
          fi
          echo "Tất cả job CI xanh."
