name: Installer matrix

# Chạy trên PUSH THƯỜNG (không đợi tag release) để bắt lỗi build/khởi động
# genh sớm trên nhiều OS — xem docs/handoff/05-installer.md mục "Kiểm thử
# trình cài". File RIÊNG (không sửa ci.yml) để không đụng job api/web/images
# hiện có.
on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: installer-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Ma trận đúng tài liệu: Ubuntu 22.04/24.04, macOS 14 arm64, Windows 11
  # (runner GitHub-hosted gần nhất: windows-2022). Build genh TỪ SOURCE ngay
  # trong job này (không chờ release.yml) rồi xác nhận binary chạy được.
  build-and-smoke:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"

      - name: Build genh từ mã nguồn (native GOOS/GOARCH của runner)
        working-directory: apps/genh
        shell: bash
        run: |
          set -euo pipefail
          out="genh"
          if [ "${{ runner.os }}" = "Windows" ]; then out="genh.exe"; fi
          go build -o "$out" ./cmd/genh
          echo "GENH_BIN=$out" >>"$GITHUB_ENV"

      - name: genh version / help chạy được trên ${{ matrix.os }}
        working-directory: apps/genh
        shell: bash
        run: |
          set -euo pipefail
          ./"${GENH_BIN}" version
          ./"${GENH_BIN}" help

      # Docker chỉ có sẵn mặc định trên runner Ubuntu GitHub-hosted — macOS/
      # Windows KHÔNG có, nên chỉ thử cài đặt thật trên Linux, và vẫn chỉ
      # best-effort: deploy/compose.yaml hiện dùng "build:" cục bộ cho api/
      # web/bridge/db/migrate/worker (chưa build ở CI này — xem release.yml
      # job build-images), nên `genh install` THẬT SỰ sẽ dừng ở bước cần
      # image những service đó. Không coi lỗi ở bước đó là lỗi CI — chỉ xác
      # nhận binary chạy, đọc máy, sinh bí mật... không panic. "Cài đặt
      # đầu-cuối thật trên ma trận OS" (yêu cầu ảnh publish sẵn từ
      # release.yml) là việc tương lai, chưa làm ở đây.
      - name: (chỉ Linux, có Docker) genh install --yes best-effort
        if: runner.os == 'Linux'
        working-directory: apps/genh
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          docker version
          ./"${GENH_BIN}" install --install-dir /tmp/genh-installer-matrix --port 18443 --yes || \
            echo "genh install dừng giữa chừng (dự kiến — deploy/compose.yaml chưa có image publish sẵn cho api/web/bridge/db/migrate/worker ở nhánh này, xem release.yml job build-images/pin-compose). Đây là smoke-test best-effort, không chặn CI."
