name: E2E cài đặt thật

# Installer-matrix.yml chỉ smoke-test binary (genh version/help), KHÔNG cài
# dịch vụ thật (deploy/compose.yaml build cục bộ, không có ảnh publish sẵn ở
# nhánh thường — xem comment trong file đó). Workflow NÀY là lần kiểm THẬT
# duy nhất: cài toàn bộ Gen-Harness bằng Docker trên runner ubuntu-24.04
# (Docker có sẵn) — xem docs/handoff/05-installer.md mục "Kiểm thử trình
# cài": "Mỗi ô: cài sạch → /api/ready xanh → genh update → genh uninstall".
#
# CỔNG PHÁT HÀNH (v0.1.33, F-9/F-13): release.yml chỉ tạo BẢN THỬ
# (prerelease, không đổi latest). Workflow này cài thật ĐÚNG tag bản thử đó;
# e2e-install + e2e-upgrade xanh thì job cuối `promote` mới nâng nó thành
# BẢN CHÍNH THỨC (latest) — lúc đó máy Boss (install.sh, genh tự cập nhật)
# mới thấy. E2E đỏ → bản thử nằm yên, bản chính thức không đổi.
#
# Job `resolve` quyết định mọi thứ (mode, tag, có chạy E2E/promote không):
#   - workflow_run (workflow "Release" xong) → CHẾ ĐỘ "release": tìm tag trỏ
#     ĐÚNG commit Release vừa chạy (head_sha). Không có tag (lượt Release bỏ
#     qua vì VERSION không đổi) hoặc Release không success → không làm gì.
#     Có tag và còn là bản thử → E2E rồi promote.
#   - workflow_dispatch → CHẾ ĐỘ "release": `tag` (bỏ trống = bản chính thức
#     hiện tại), `promote` (E2E xanh thì nâng tag thành latest), `skip_e2e`
#     (promote tay BỎ QUA E2E — chỉ khi E2E lỗi vì lý do ngoài mã).
#   - pull_request/push đổi các đường dẫn ở `paths` dưới → CHẾ ĐỘ "pr":
#     build genh TỪ SOURCE (đúng commit đang xét, bắt lỗi code genh sớm),
#     trỏ genh vào deploy/compose.yaml của checkout (build ảnh cục bộ — bắt
#     lỗi ảnh api/web trước khi phát hành), lấy compose.release.yaml của BẢN
#     CHÍNH THỨC mới nhất (releases/latest) để nhúng vào binary — giống bước
#     "Ghim compose.yaml đã publish vào binary" của release.yml.
#
# LƯU Ý: workflow này LỌC ĐƯỜNG DẪN (paths) nên KHÔNG được làm required check
# trong branch protection — PR không chạm các đường dẫn đó sẽ treo "Expected"
# mãi. Required check duy nhất là job tổng ci-ok / installer-ok.
#
# THÀNH THẬT: bước "tạo dữ liệu mẫu" (mục 4 trong kế hoạch) chỉ gọi được
# `POST /api/v1/setup/steps/1` (bước 1 của trình thiết lập 12 bước, xem
# apps/api/gh/setup/routes.py — bước này là DUY NHẤT không cần tài khoản
# Owner, chỉ cần setup_token) ở chế độ mode=sample — các bước 2 trở đi cần
# tạo tài khoản Owner + PIN + tổ chức thật, kết nối kênh Zalo bằng QR (không
# tự động hoá được trong CI, cần con người quét mã) nên KHÔNG làm ở đây, xem
# ghi chú ngay tại bước đó bên dưới.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag bản phát hành để kiểm (bỏ trống = bản chính thức mới nhất, releases/latest)"
        required: false
        type: string
      promote:
        description: "E2E xanh thì nâng tag này thành latest"
        required: false
        type: boolean
        default: false
      skip_e2e:
        description: "Promote tay, BỎ QUA E2E — chỉ dùng khi E2E lỗi vì lý do ngoài mã (GitHub/mạng); bắt buộc có tag và promote=true"
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - "apps/genh/**"
      - "apps/api/**"
      - "apps/web/Dockerfile"
      - "deploy/**"
      - "deploy/images/**"
      - "install.sh"
      - "VERSION"
      - ".github/workflows/e2e-install.yml"
  push:
    branches: [main, "claude/**"]
    paths:
      - "apps/genh/**"
      - "apps/api/**"
      - "apps/web/Dockerfile"
      - "deploy/**"
      - "deploy/images/**"
      - "install.sh"
      - "VERSION"
      - ".github/workflows/e2e-install.yml"

# Nhóm theo ĐÚNG đối tượng được kiểm: workflow_run theo commit Release
# (head_sha), dispatch theo tag, pr/push theo ref. Chỉ pr/push được huỷ lượt
# cũ — một lượt Release bỏ qua (skip=true, commit khác) chạy sau KHÔNG được
# huỷ nhầm E2E của bản thử đang kiểm.
concurrency:
  group: e2e-install-${{ github.event_name }}-${{ github.event.workflow_run.head_sha || inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  # ── resolve ──────────────────────────────────────────────────────────────
  # Nguồn duy nhất cho mode (pr|release), tag cần kiểm, có chạy E2E không,
  # có promote không, và bản chính thức liền trước (prev_tag) cho e2e-upgrade.
  # Mọi giá trị do người/sự kiện đưa vào (inputs.*, workflow_run.*) chỉ đi
  # qua env — không nội suy ${{ }} thẳng vào shell.
  resolve:
    name: xác định chế độ, tag cần kiểm, có promote không
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.r.outputs.mode }}
      tag: ${{ steps.r.outputs.tag }}
      run_e2e: ${{ steps.r.outputs.run_e2e }}
      promote: ${{ steps.r.outputs.promote }}
      skip_e2e: ${{ steps.r.outputs.skip_e2e }}
      prev_tag: ${{ steps.r.outputs.prev_tag }}
      broken_install: ${{ steps.r.outputs.broken_install }}
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
      EVENT: ${{ github.event_name }}
      RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      RUN_SHA: ${{ github.event.workflow_run.head_sha }}
      IN_TAG: ${{ inputs.tag }}
      IN_PROMOTE: ${{ inputs.promote }}
      IN_SKIP_E2E: ${{ inputs.skip_e2e }}
    steps:
      - name: Lấy mã nguồn (cần remote origin cho git ls-remote)
        uses: actions/checkout@v4

      - name: Xác định chế độ, tag, run_e2e, promote, prev_tag
        id: r
        run: |
          set -euo pipefail
          # Bản chính thức (latest) hiện tại; rỗng nếu repo chưa có (404).
          # Không dùng `$(… || true)`: khi lỗi HTTP, gh api vẫn in thân JSON
          # lỗi ra stdout.
          latest_official() {
            local t
            if t="$(gh api "repos/$R/releases/latest" --jq .tag_name 2>/dev/null)"; then printf '%s' "$t"; fi
          }
          # Tag trỏ đúng commit $1 (tag nhẹ: "<sha> refs/tags/vX"; tag có chú
          # thích: thêm dòng "<sha> refs/tags/vX^{}") — đọc từ stdin là đầu ra
          # `git ls-remote --tags origin`. Không có → rỗng.
          tag_at_sha() {
            awk -v s="$1" '$1==s{print $2}' | sed -e 's#^refs/tags/##' -e 's#\^{}$##' \
              | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' || true; } | sort -V | tail -n1
          }

          mode=release
          tag=""
          run_e2e=true
          promote=false
          skip_e2e=false
          case "$EVENT" in
            pull_request | push)
              mode=pr
              tag="$(latest_official)"
              if [ -z "$tag" ]; then
                echo "::error::Chưa có bản chính thức (releases/latest) nào để lấy compose.release.yaml — cần phát hành và promote ít nhất một bản (merge PR tăng VERSION, chờ E2E xanh) trước khi chế độ pr kiểm được." >&2
                exit 1
              fi
              ;;
            workflow_run)
              if [ "$RUN_CONCLUSION" != "success" ]; then
                echo "Release kết thúc '$RUN_CONCLUSION' (không phải success) — không có bản thử mới để kiểm, bỏ qua."
                run_e2e=false
              else
                # ls-remote chạy riêng để lỗi mạng làm job ĐỎ (không lặng lẽ
                # coi như "không có tag" rồi bỏ qua E2E của bản thử thật).
                refs="$(git ls-remote --tags origin)"
                tag="$(printf '%s\n' "$refs" | tag_at_sha "$RUN_SHA")"
                if [ -z "$tag" ]; then
                  echo "không có bản phát hành mới ở $RUN_SHA — bỏ qua (lượt Release bỏ qua vì VERSION không đổi)."
                  run_e2e=false
                else
                  if ! info="$(gh release view "$tag" --repo "$R" --json isPrerelease,isDraft --jq '"\(.isPrerelease) \(.isDraft)"')"; then
                    echo "::error::Tag $tag trỏ đúng commit $RUN_SHA nhưng không có GitHub Release tương ứng — kiểm lại job release của lượt Release vừa chạy (log bước softprops/action-gh-release)." >&2
                    exit 1
                  fi
                  is_pre="${info%% *}"
                  is_draft="${info##* }"
                  if [ "$is_draft" = "true" ]; then
                    echo "::error::Release $tag đang là bản nháp (draft) — install.sh không tải được. Bỏ nháp (gh release edit $tag --draft=false) rồi chạy tay workflow này với tag=$tag, promote=true." >&2
                    exit 1
                  fi
                  case "$tag" in
                    *-*) echo "$tag có hậu tố '-' — chỉ kiểm, KHÔNG bao giờ promote thành bản chính thức." ;;
                    *) if [ "$is_pre" = "true" ]; then promote=true; fi ;;
                  esac
                  echo "bản thử: $tag (prerelease=$is_pre) ở commit $RUN_SHA"
                fi
              fi
              ;;
            workflow_dispatch)
              tag="$IN_TAG"
              if [ -z "$tag" ]; then
                tag="$(latest_official)"
              fi
              promote="${IN_PROMOTE:-false}"
              skip_e2e="${IN_SKIP_E2E:-false}"
              if [ "$skip_e2e" = "true" ]; then
                if [ -z "$IN_TAG" ] || [ "$promote" != "true" ]; then
                  echo "::error::skip_e2e=true bắt buộc nhập tag cụ thể VÀ bật promote=true — chạy lại workflow với đủ cả hai, hoặc tắt skip_e2e để chạy E2E bình thường." >&2
                  exit 1
                fi
                run_e2e=false
                echo "::warning::PROMOTE TAY — sẽ bỏ qua E2E cho $tag. Chỉ dùng khi E2E lỗi vì lý do ngoài mã (GitHub/mạng); ghi lại lý do vào HANDOFF."
              fi
              if [ -z "$tag" ]; then
                echo "::error::Chưa có bản chính thức (releases/latest) nào — nhập tag cụ thể ở ô 'tag' khi chạy tay." >&2
                exit 1
              fi
              if ! gh release view "$tag" --repo "$R" --json tagName >/dev/null; then
                echo "::error::Không tìm thấy GitHub Release '$tag' — kiểm lại tên tag (dạng vMAJOR.MINOR.PATCH, vd v0.1.33)." >&2
                exit 1
              fi
              ;;
            *)
              echo "::error::sự kiện '$EVENT' không được hỗ trợ" >&2
              exit 1
              ;;
          esac

          if [ -n "$tag" ] && ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::tag '$tag' không đúng định dạng vMAJOR.MINOR.PATCH[-PRERELEASE] — nhập lại tag đúng (vd v0.1.33)." >&2
            exit 1
          fi

          # prev_tag cho e2e-upgrade = bản CHÍNH THỨC gần nhất cũ hơn $tag
          # (bỏ bản nháp + bản thử) — chính là bản máy Boss đang chạy.
          prev=""
          broken=false
          if [ "$mode" = "release" ] && [ "$run_e2e" = "true" ]; then
            official="$(gh release list --repo "$R" --exclude-drafts --exclude-pre-releases --limit 10 --json tagName --jq '.[].tagName')"
            for t in $official; do
              [ "$t" != "$tag" ] || continue
              if [ "$(printf '%s\n%s\n' "$t" "$tag" | sort -V | head -n1)" = "$t" ]; then
                prev="$t"
                break
              fi
            done
            # Các bản genh ≤ v0.1.8 cài từ binary phát hành KHÔNG ghi
            # Caddyfile (≤v0.1.7) hoặc đụng nhau khi chép volume agy_state
            # (≤v0.1.8) → không lên (Docker tạo thư mục rỗng thay tệp). Với
            # các bản đó, bước cài bản cũ được phép đỏ; bước `genh update`
            # phía sau phải TỰ SỬA máy cài lỗi đó rồi ready xanh.
            case "$prev" in
              v0.1.[0-8]) broken=true; echo "bản trước $prev thuộc nhóm cài lỗi Caddyfile — kiểm đường tự sửa khi update" ;;
            esac
            if [ -z "$prev" ]; then
              echo "chưa có bản chính thức nào cũ hơn $tag — e2e-upgrade sẽ bỏ qua."
            fi
          fi

          {
            echo "mode=$mode"
            echo "tag=$tag"
            echo "run_e2e=$run_e2e"
            echo "promote=$promote"
            echo "skip_e2e=$skip_e2e"
            echo "prev_tag=$prev"
            echo "broken_install=$broken"
          } >>"$GITHUB_OUTPUT"
          {
            echo "### E2E cài đặt thật — quyết định"
            echo "| mode | tag | run_e2e | promote | skip_e2e | prev_tag |"
            echo "|---|---|---|---|---|---|"
            echo "| $mode | ${tag:--} | $run_e2e | $promote | $skip_e2e | ${prev:--} |"
          } >>"$GITHUB_STEP_SUMMARY"
          echo "mode=$mode tag=${tag:-<rỗng>} run_e2e=$run_e2e promote=$promote skip_e2e=$skip_e2e prev_tag=${prev:-<rỗng>}"

  # ── e2e-install ──────────────────────────────────────────────────────────
  # Luồng chính (mục 1-10 trong kế hoạch bàn giao): cài sạch, chờ ready,
  # status, dữ liệu mẫu (best-effort), backup, export/import, update,
  # auto-update enable/status/disable, uninstall — log docker compose luôn
  # in ra dù bước nào lỗi (if: always()).
  e2e-install:
    name: cài đặt thật đầu-cuối (chế độ ${{ needs.resolve.outputs.mode }}${{ needs.resolve.outputs.mode == 'release' && format(', {0}', needs.resolve.outputs.tag) || '' }})
    needs: resolve
    if: needs.resolve.outputs.run_e2e == 'true'
    runs-on: ubuntu-24.04
    # Chạy ngoài checkout repo: genh tìm compose.yaml theo cwd trước — trong repo
    # nó sẽ dùng deploy/compose.yaml (build cục bộ) thay vì compose bản phát hành
    # nhúng trong binary như máy người dùng thật.
    defaults:
      run:
        working-directory: /tmp
    timeout-minutes: 45
    env:
      # GEN_HARNESS_HOME KHÔNG đặt bằng ${{ runner.temp }} ở đây — "runner"
      # không nằm trong danh sách context cho phép ở `env:` cấp job (kiểm
      # bằng actionlint, xem contexts#context-availability) — đặt qua
      # $GITHUB_ENV ở bước đầu tiên bên dưới, đọc $RUNNER_TEMP (biến môi
      # trường runner luôn có sẵn, tương đương giá trị của context đó).
      GH_PORT: "8443"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      R: ${{ github.repository }}
      # pr: bản chính thức lấy compose.release.yaml; release: tag cài đặt.
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Đặt GEN_HARNESS_HOME (thư mục cài đặt tạm của job này)
        run: echo "GEN_HARNESS_HOME=$RUNNER_TEMP/gh" >>"$GITHUB_ENV"

      - name: (pr) Trỏ genh vào deploy/compose.yaml của checkout
        if: needs.resolve.outputs.mode == 'pr'
        # Chế độ pr kiểm CODE của PR, kể cả ảnh api/worker/web/bridge/db:
        # trỏ genh vào deploy/compose.yaml của checkout (build: cục bộ) thay
        # vì ảnh đã publish — nếu không, lỗi trong ảnh (vd thiếu thư viện
        # Python) chỉ lộ ra SAU khi đã phát hành.
        run: echo "GENH_COMPOSE_FILE=$GITHUB_WORKSPACE/deploy/compose.yaml" >>"$GITHUB_ENV"

      # ── Chế độ "pr": build genh từ source, ghim compose.release.yaml đã
      # publish của bản chính thức mới nhất (releases/latest) ────────────────
      - name: (pr) Cài Go
        if: needs.resolve.outputs.mode == 'pr'
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"

      - name: (pr) Tải deploy/compose.release.yaml của bản chính thức ${{ needs.resolve.outputs.tag }}
        if: needs.resolve.outputs.mode == 'pr'
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$R" \
            --pattern 'compose.release.yaml' --dir "${{ runner.temp }}/pinned" --clobber

      - name: (pr) Ghim compose.yaml đã publish vào binary (giống bước cùng tên ở release.yml)
        if: needs.resolve.outputs.mode == 'pr'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          cp "${{ runner.temp }}/pinned/compose.release.yaml" apps/genh/internal/compose/embedded_compose.yaml
          echo "đã ghi đè embedded_compose.yaml bằng compose.release.yaml của $TAG (digest thật):"
          grep '^\s*image:' apps/genh/internal/compose/embedded_compose.yaml || true

      - name: (pr) Build genh từ mã nguồn đang xét
        if: needs.resolve.outputs.mode == 'pr'
        working-directory: ${{ github.workspace }}/apps/genh
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          # KHÔNG gắn -ldflags -X main.version=... ở đây — giữ mặc định "dev"
          # (xem cmd/genh/main.go, biến version) để internal/selfupdate CHỦ
          # ĐỘNG bỏ qua tự cập nhật binary (current=="dev" ⇒ Skipped, xem
          # apps/genh/internal/selfupdate/selfupdate.go dòng ~165) — build
          # tuỳ ý một chuỗi version giả (vd "e2e-pr-<sha>") sẽ đi vào nhánh
          # so sánh semver thật với bản mới nhất trên GitHub Releases, không
          # phải điều `genh update --yes` ở bước "đã mới nhất → phải không
          # lỗi" của chế độ pr muốn kiểm (chế độ pr kiểm CODE genh hiện tại,
          # không kiểm cơ chế tự tải binary — cơ chế đó đã có test riêng ở
          # apps/genh/internal/selfupdate và được chế độ "release" ở trên
          # dùng thật với version thật của binary đã publish).
          go build -trimpath -ldflags "-s -w" -o "${{ runner.temp }}/genh" ./cmd/genh
          echo "GENH=${{ runner.temp }}/genh" >>"$GITHUB_ENV"

      # ── Chế độ "release": tải install.sh + asset THẬT của ĐÚNG tag (thường
      # là bản thử vừa tạo), chạy y hệt người dùng thật (curl … | sh) ───────
      - name: (release) Tải install.sh của bản phát hành ${{ needs.resolve.outputs.tag }}
        if: needs.resolve.outputs.mode == 'release'
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$R" \
            --pattern 'install.sh' --dir "$RUNNER_TEMP" --clobber
          chmod +x "$RUNNER_TEMP/install.sh"

      - name: (release) Cài sạch bằng install.sh thật của ${{ needs.resolve.outputs.tag }} (không tương tác)
        if: needs.resolve.outputs.mode == 'release'
        run: |
          set -euo pipefail
          # install.sh (xem file gốc): phát hiện OS/kiến trúc, tải đúng asset
          # genh-linux-amd64 + checksums.txt, kiểm SHA-256. Mặc định nó tải từ
          # /releases/latest/download — bản thử (prerelease) KHÔNG nằm ở đó,
          # nên đặt GEN_HARNESS_RELEASE_TAG để install.sh tải ĐÚNG tag đang
          # kiểm (biến chỉ dành cho CI/E2E). install.sh không nhận cờ, tự
          # `exec genh install` KHÔNG kèm cờ nào (máy sạch → không có
          # secrets.json). Không cần TTY: genh install tự chuyển "chế độ
          # dòng" khi stdout không phải terminal (xem tui.IsTerminal,
          # apps/genh/cmd/genh/main.go hàm runInstall) — CI không có TTY nên
          # đây CHÍNH LÀ phép kiểm "genh install có chế độ không TTY" mà kế
          # hoạch bàn giao yêu cầu, không cần thêm cờ gì ở installer.sh.
          # Docker Engine đã có sẵn ≥24 trên ubuntu-24.04 nên Bước 2 (runtime)
          # tự bỏ qua (StatusSkipped) — không cần --yes cho sudo/UAC gì cả;
          # thứ duy nhất bị ảnh hưởng là CA nội bộ không được tự tin cậy vào
          # hệ điều hành (StatusWarn, không chặn cài đặt) — vì vậy các bước
          # `curl` sau này đều dùng `-k`.
          GEN_HARNESS_RELEASE_TAG="$TAG" "$RUNNER_TEMP/install.sh"
          echo "GENH=${GEN_HARNESS_HOME}/bin/genh" >>"$GITHUB_ENV"

      - name: (release) Kiểm genh vừa cài đúng tag ${{ needs.resolve.outputs.tag }}
        if: needs.resolve.outputs.mode == 'release'
        run: |
          set -euo pipefail
          out="$("$GENH" version)"
          echo "$out"
          # So khớp NGUYÊN từ (v0.1.3 không được khớp nhầm v0.1.33).
          case " $out " in
            *" $TAG "*) echo "OK: genh đã cài đúng $TAG" ;;
            *)
              echo "::error::genh vừa cài báo '$out', không phải $TAG — install.sh đã tải nhầm bản (kiểm GEN_HARNESS_RELEASE_TAG trong install.sh của $TAG và asset genh-linux-amd64 của Release)." >&2
              exit 1
              ;;
          esac

      - name: In phiên bản genh vừa cài
        run: "$GENH version"

      # ── (pr) genh install trực tiếp bằng binary vừa build — install.sh
      # không dùng ở chế độ này vì nó tải BẢN ĐÃ PUBLISH, không phải bản
      # đang review ──────────────────────────────────────────────────────────
      - name: (pr) Cài sạch không tương tác bằng genh build từ source
        if: needs.resolve.outputs.mode == 'pr'
        run: |
          set -euo pipefail
          "$GENH" install --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" --yes --no-auto-update

      - name: Chờ /api/v1/ready xanh (tối đa 5 phút)
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 300))
          until curl -k -fsS -o /tmp/ready.json "https://localhost:${GH_PORT}/api/v1/ready"; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::/api/v1/ready không xanh sau 5 phút" >&2
              exit 1
            fi
            sleep 3
          done
          cat /tmp/ready.json
          echo

      - name: genh status (kiểm mọi dịch vụ healthy)
        run: |
          set -euo pipefail
          "$GENH" status --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" | tee /tmp/genh-status.txt
          # RunStatus (internal/ops/status.go) không tự fail khi có service
          # không healthy (chỉ IN bảng) — kiểm tay ở đây: không được có
          # "unhealthy" hay "exited"/"restarting" trong bảng docker compose ps.
          if grep -Eiq 'unhealthy|exited|restarting' /tmp/genh-status.txt; then
            echo "::error::genh status thấy dịch vụ không healthy — xem bảng ở trên" >&2
            exit 1
          fi

      - name: Dữ liệu mẫu tối thiểu — best-effort, xem ghi chú đầu file
        continue-on-error: true
        run: |
          set -euo pipefail
          token="$(python3 -c "import json;print(json.load(open('${GEN_HARNESS_HOME}/config/secrets.json'))['setup_token'])")"
          curl -k -fsS -X POST "https://localhost:${GH_PORT}/api/v1/setup/steps/1" \
            -H 'Content-Type: application/json' \
            -d "{\"token\":\"${token}\",\"language\":\"vi\",\"mode\":\"sample\"}" \
            && echo "OK: bước 1/12 (mode=sample) đã gọi được — dữ liệu mẫu (nếu có) do backend tự sinh." \
            || echo "BỎ QUA: bước 1/12 gọi lỗi hoặc backend chưa hỗ trợ tạo mẫu qua API — không chặn CI (xem ghi chú đầu workflow, các bước 2-12 cần tài khoản Owner + QR Zalo, không tự động hoá được)."

      - name: genh backup
        run: $GENH backup --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT"

      - name: genh export → genh import (bọc lại chính bản export)
        env:
          GH_BUNDLE_PASSWORD: e2e-install-test-password-not-a-secret
        run: |
          set -euo pipefail
          "$GENH" export --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" --to "${{ runner.temp }}/p.ghbundle"
          ls -la "${{ runner.temp }}/p.ghbundle"
          # QUAN TRỌNG: mọi cờ (--install-dir/--port/--yes) PHẢI đứng TRƯỚC
          # đường dẫn tệp — package "flag" của Go dừng phân tích cờ ở đối số
          # KHÔNG-CỜ đầu tiên (xem cmd/genh/main.go hàm runImport, fs.NArg()
          # != 1 sẽ báo lỗi cách dùng nếu đặt --yes sau đường dẫn tệp).
          "$GENH" import --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" --yes "${{ runner.temp }}/p.ghbundle"

      - name: Chờ /api/v1/ready xanh lại sau import (tối đa 5 phút)
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 300))
          until curl -k -fsS -o /dev/null "https://localhost:${GH_PORT}/api/v1/ready"; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::/api/v1/ready không xanh lại sau import" >&2
              exit 1
            fi
            sleep 3
          done

      - name: genh update --yes (đã mới nhất → phải không lỗi)
        # Chế độ release: genh đang là bản thử, releases/latest (bản chính thức)
        # CŨ hơn → selfupdate không hạ cấp (IsNewer=false), chỉ chạy phần dịch vụ.
        run: $GENH update --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" --yes

      - name: Nút "Cập nhật ngay" — api ghi yêu cầu, genh trên máy chủ tự nhận và cập nhật (tối đa 7 phút)
        run: |
          set -euo pipefail
          run="$GEN_HARNESS_HOME/run"
          cat "$run/genh.json"
          python3 -c "import json,sys; i=json.load(open(sys.argv[1])); assert i['updater'], 'genh chưa cài watcher nhận yêu cầu: %s' % i" "$run/genh.json"
          before="$(python3 -c "import json;print(json.load(open('$run/update-status.json')).get('started_at',''))" 2>/dev/null || true)"
          api="$(docker ps --format '{{.Names}}' | grep -E '^gen-harness-api-[0-9]+$' | head -1)"
          # Chính container api (uid 10001, khác người dùng máy chủ) ghi yêu cầu qua bind mount — đúng đường nút bấm
          # trong Console đi (gh/system_api/update.py).
          docker exec "$api" python -c "import json,datetime; open('/var/lib/gh/host/request/update.json','w').write(json.dumps({'requested_at': datetime.datetime.now(datetime.timezone.utc).isoformat()}))"
          deadline=$((SECONDS + 420))
          while :; do
            st="$(python3 -c "import json;d=json.load(open('$run/update-status.json'));print(d.get('state',''), d.get('started_at',''))" 2>/dev/null || true)"
            state="${st%% *}"; started="${st#* }"
            if [ "$started" != "$before" ] && [ "$state" = done ] && [ ! -e "$run/request/update.json" ]; then break; fi
            if [ "$started" != "$before" ] && [ "$state" = failed ]; then
              cat "$run/update-status.json"; echo "::error::genh báo cập nhật lỗi" >&2; exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              ls -la "$run" "$run/request"; cat "$run/update-status.json" || true
              echo "::error::watcher trên máy chủ không nhận yêu cầu cập nhật trong 7 phút" >&2; exit 1
            fi
            sleep 5
          done
          cat "$run/update-status.json"
          until curl -k -fsS -o /dev/null "https://localhost:${GH_PORT}/api/v1/ready"; do sleep 3; done

      - name: Nút "Khôi phục" — api ghi request/restore.json, genh trên máy chủ tự khôi phục (tối đa 7 phút)
        run: |
          set -euo pipefail
          run="$GEN_HARNESS_HOME/run"
          python3 -c "import json,sys; i=json.load(open(sys.argv[1])); assert 'restore' in (i.get('requests') or []), 'watcher chưa nhận yêu cầu khôi phục: %s' % i" "$run/genh.json"
          api="$(docker ps --format '{{.Names}}' | grep -E '^gen-harness-api-[0-9]+$' | head -1)"
          key="$(docker exec "$api" python -c "import asyncio; from gh.backup import list_backups; print(asyncio.run(list_backups())[0].key)")"
          echo "khôi phục $key"
          # Như nút trong Console (gh/system_api/backups.py): container api ghi yêu cầu qua bind mount.
          docker exec "$api" python -c "import json,sys,datetime; open('/var/lib/gh/host/request/restore.json','w').write(json.dumps({'key': sys.argv[1], 'requested_at': datetime.datetime.now(datetime.timezone.utc).isoformat()}))" "$key"
          deadline=$((SECONDS + 420))
          while :; do
            st="$(python3 -c "import json;d=json.load(open('$run/restore-status.json'));print(d.get('state',''), d.get('key',''))" 2>/dev/null || true)"
            state="${st%% *}"; got="${st#* }"
            if [ "$got" = "$key" ] && [ "$state" = done ] && [ ! -e "$run/request/restore.json" ]; then break; fi
            if [ "$got" = "$key" ] && [ "$state" = failed ]; then
              cat "$run/restore-status.json"; echo "::error::genh báo khôi phục lỗi" >&2; exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              ls -la "$run" "$run/request"; cat "$run/restore-status.json" || true
              echo "::error::watcher trên máy chủ không khôi phục trong 7 phút" >&2; exit 1
            fi
            sleep 5
          done
          cat "$run/restore-status.json"
          until curl -k -fsS -o /dev/null "https://localhost:${GH_PORT}/api/v1/ready"; do sleep 3; done

      - name: genh auto-update enable → status → disable
        run: |
          set -euo pipefail
          # Runner GitHub-hosted KHÔNG có `loginctl`/session người dùng thật
          # (systemd --user có thể không chạy được, xem
          # docs/handoff/05-installer.md mục "Docker Engine tĩnh trên Linux" và
          # commit 1e21561 "bật loginctl linger") — internal/autoupdate tự rơi
          # về crontab nếu systemd --user không hoạt động (xem
          # internal/autoupdate/autoupdate.go); chỉ kiểm 3 lệnh chạy KHÔNG
          # crash (exit 0), không ép buộc cơ chế cụ thể nào phải được dùng.
          "$GENH" auto-update enable --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT"
          "$GENH" auto-update status --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT"
          "$GENH" auto-update disable --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT"

      - name: genh uninstall --yes (không tương tác)
        run: $GENH uninstall --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" --yes

      - name: (luôn) In log docker compose (tail 200) để debug
        if: always()
        run: |
          set -euo pipefail
          docker ps -a || true
          for c in $(docker ps -a --format '{{.Names}}' | grep '^gen-harness-' || true); do
            echo "════ $c ════"
            docker logs --tail 200 "$c" 2>&1 || true
          done

      - name: (luôn) In log genh (~/.gen-harness/logs) để debug
        if: always()
        run: |
          set -euo pipefail
          if [ -d "$GEN_HARNESS_HOME/logs" ]; then
            for f in "$GEN_HARNESS_HOME"/logs/*; do
              echo "── $f ──"
              tail -n 200 "$f" || true
            done
          else
            echo "không thấy $GEN_HARNESS_HOME/logs"
          fi

  # ── e2e-upgrade ──────────────────────────────────────────────────────────
  # Chỉ chạy ở chế độ release (kiểm nâng cấp cần CÓ bản chính thức THẬT trước
  # đó — chế độ pr build từ source, không có "bản trước" để nâng cấp lên chính
  # commit đang review) và khi resolve tìm được prev_tag.
  # Kịch bản: cài BẢN CHÍNH THỨC liền trước (prev_tag = bản máy Boss đang chạy)
  # → đặt genh của tag đang kiểm đè lên → genh update --yes --no-self-update
  # → ready xanh → genh version đúng tag → xác nhận dữ liệu/bí mật KHÔNG bị
  # tạo lại (app_db_password không đổi).
  #
  # THÀNH THẬT: genh cũ tự cập nhật (internal/selfupdate) CHỈ thấy
  # releases/latest — bản thử (prerelease) bị ẩn, nên nó sẽ không tự tải được
  # bản đang kiểm. Vì vậy E2E tự tải genh-linux-amd64 + checksums.txt của tag
  # đang kiểm, kiểm sha256 rồi đặt binary mới bằng tay; đường "genh cũ tự tải
  # binary mới" KHÔNG đi qua ở đây — đường đó do go test của
  # apps/genh/internal/selfupdate kiểm.
  e2e-upgrade:
    name: nâng cấp ${{ needs.resolve.outputs.prev_tag }} → ${{ needs.resolve.outputs.tag }}
    needs: resolve
    if: needs.resolve.outputs.run_e2e == 'true' && needs.resolve.outputs.mode == 'release' && needs.resolve.outputs.prev_tag != ''
    runs-on: ubuntu-24.04
    # Chạy ngoài checkout repo: genh tìm compose.yaml theo cwd trước — trong repo
    # nó sẽ dùng deploy/compose.yaml (build cục bộ) thay vì compose bản phát hành
    # nhúng trong binary như máy người dùng thật.
    defaults:
      run:
        working-directory: /tmp
    timeout-minutes: 30
    env:
      # Xem ghi chú tương tự ở job e2e-install — không dùng ${{ runner.temp }}
      # trong `env:` cấp job.
      GH_PORT: "8444"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      R: ${{ github.repository }}
      TAG: ${{ needs.resolve.outputs.tag }}
      PREV_TAG: ${{ needs.resolve.outputs.prev_tag }}
    steps:
      - name: Lấy mã nguồn (chỉ cần cho tham chiếu, không build gì ở job này)
        uses: actions/checkout@v4

      - name: Đặt GEN_HARNESS_HOME (thư mục cài đặt tạm của job này)
        run: echo "GEN_HARNESS_HOME=$RUNNER_TEMP/gh-upgrade" >>"$GITHUB_ENV"

      - name: Cài sạch bản chính thức TRƯỚC ĐÓ (${{ needs.resolve.outputs.prev_tag }})
        continue-on-error: ${{ needs.resolve.outputs.broken_install == 'true' }}
        run: |
          set -euo pipefail
          # Tự tải asset của đúng prev_tag rồi làm y hệt phần thân install.sh
          # (kiểm checksum, đặt vào bin/) — install.sh của bản cũ chưa biết
          # GEN_HARNESS_RELEASE_TAG, gọi thẳng nó sẽ ra bản chính thức hiện tại.
          mkdir -p "$GEN_HARNESS_HOME/bin"
          gh release download "$PREV_TAG" --repo "$R" \
            --pattern 'genh-linux-amd64' --pattern 'checksums.txt' --dir "$RUNNER_TEMP/prev" --clobber
          want="$(awk '$2=="genh-linux-amd64"||$2=="./genh-linux-amd64"{print $1}' "$RUNNER_TEMP/prev/checksums.txt")"
          got="$(sha256sum "$RUNNER_TEMP/prev/genh-linux-amd64" | awk '{print $1}')"
          [ -n "$want" ] && [ "$got" = "$want" ] || { echo "::error::sha256 của genh-linux-amd64 ($PREV_TAG) không khớp checksums.txt — asset Release bị thay hoặc tải hỏng; tải lại/kiểm Release $PREV_TAG." >&2; exit 1; }
          install -m 0755 "$RUNNER_TEMP/prev/genh-linux-amd64" "$GEN_HARNESS_HOME/bin/genh"
          "$GEN_HARNESS_HOME/bin/genh" version
          "$GEN_HARNESS_HOME/bin/genh" install --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" --yes --no-auto-update

      - name: Chờ /api/v1/ready xanh (bản cũ, tối đa 5 phút)
        if: needs.resolve.outputs.broken_install != 'true'
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 300))
          until curl -k -fsS -o /dev/null "https://localhost:${GH_PORT}/api/v1/ready"; do
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::ready không xanh (bản cũ)" >&2; exit 1; }
            sleep 3
          done

      - name: Ghi lại app_db_password TRƯỚC khi nâng cấp
        id: before
        run: |
          set -euo pipefail
          pw="$(python3 -c "import json;print(json.load(open('${GEN_HARNESS_HOME}/config/secrets.json'))['app_db_password'])")"
          echo "::add-mask::$pw"
          echo "pw=$pw" >>"$GITHUB_OUTPUT"

      - name: Đặt genh ${{ needs.resolve.outputs.tag }} đè lên genh cũ (tải + kiểm sha256)
        run: |
          set -euo pipefail
          # Xem ghi chú THÀNH THẬT ở đầu job: genh cũ không thấy bản thử qua
          # releases/latest nên đặt binary mới bằng tay, đúng như install.sh
          # làm (tải asset + checksums.txt của ĐÚNG tag, kiểm sha256).
          d="$RUNNER_TEMP/new"
          gh release download "$TAG" --repo "$R" \
            --pattern 'genh-linux-amd64' --pattern 'checksums.txt' --dir "$d" --clobber
          want="$(awk '$2=="genh-linux-amd64"||$2=="./genh-linux-amd64"{print $1}' "$d/checksums.txt")"
          got="$(sha256sum "$d/genh-linux-amd64" | awk '{print $1}')"
          [ -n "$want" ] && [ "$got" = "$want" ] || { echo "::error::sha256 của genh-linux-amd64 ($TAG) không khớp checksums.txt — KHÔNG promote bản này; kiểm lại asset của Release $TAG." >&2; exit 1; }
          install -m 0755 "$d/genh-linux-amd64" "$GEN_HARNESS_HOME/bin/genh"
          "$GEN_HARNESS_HOME/bin/genh" version

      - name: genh update --yes --no-self-update (genh ${{ needs.resolve.outputs.tag }} nâng cấp dịch vụ từ bản cũ)
        run: $GEN_HARNESS_HOME/bin/genh update --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" --yes --no-self-update

      - name: Chờ /api/v1/ready xanh lại sau nâng cấp (tối đa 5 phút)
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 300))
          until curl -k -fsS -o /dev/null "https://localhost:${GH_PORT}/api/v1/ready"; do
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::ready không xanh sau update" >&2; exit 1; }
            sleep 3
          done

      - name: Kiểm genh sau nâng cấp đúng tag ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          out="$("$GEN_HARNESS_HOME/bin/genh" version)"
          echo "$out"
          case " $out " in
            *" $TAG "*) echo "OK: sau nâng cấp genh là $TAG (từ $PREV_TAG)" ;;
            *)
              echo "::error::sau genh update, genh báo '$out' chứ không phải $TAG — binary bị thay ngược (vd tự cập nhật về releases/latest); KHÔNG promote, xem log bước genh update." >&2
              exit 1
              ;;
          esac

      # v0.1.29: compose mới mount Docker secret gh_browser_key (genh cũ không sinh) — genh mới (đặt đè ở bước
      # trên) phải tự sinh khoá trước `docker compose up`, và browser/browser-egress phải chạy sau nâng cấp.
      - name: Kiểm khoá gh_browser_key + dịch vụ browser sau nâng cấp (nếu compose có browser)
        run: |
          set -euo pipefail
          if ! grep -q '^  browser-egress:' "$GEN_HARNESS_HOME/deploy/compose.yaml"; then
            echo "compose.yaml bản này chưa có browser — bỏ qua."; exit 0
          fi
          test -s "$GEN_HARNESS_HOME/secrets/gh_browser_key" || { echo "::error::thiếu secrets/gh_browser_key sau genh update" >&2; exit 1; }
          "$GEN_HARNESS_HOME/bin/genh" status --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" | tee /tmp/genh-status-upg.txt
          for svc in browser browser-egress; do
            awk -v s="$svc" '$1==s && $2=="running"{f=1} END{exit !f}' /tmp/genh-status-upg.txt || { echo "::error::dịch vụ $svc không chạy sau nâng cấp" >&2; exit 1; }
          done
          if grep -Eiq 'unhealthy|exited|restarting' /tmp/genh-status-upg.txt; then
            echo "::error::có dịch vụ không healthy sau nâng cấp" >&2; exit 1
          fi
          # Cách ly: container Chromium (browser) và browser-egress KHÔNG được tới Redis chính (hàng đợi arq của
          # worker giữ khoá master) hay Postgres; browser chỉ tới browser-redis.
          probe() {  # probe <service> <host> <port> → in "reach" hoặc "blocked"
            local cid
            cid="$(docker ps -q --filter "label=com.docker.compose.service=$1" | head -n1)"
            [ -n "$cid" ] || { echo "::error::không thấy container $1" >&2; exit 1; }
            docker exec "$cid" python3 -c "import socket,sys
          try:
              socket.create_connection(('$2', $3), 3).close(); print('reach')
          except OSError:
              print('blocked')"
          }
          for svc in browser browser-egress; do
            for target in redis:6379 db:5432 api:8000; do
              r="$(probe "$svc" "${target%%:*}" "${target##*:}")"
              echo "$svc → $target: $r"
              [ "$r" = "blocked" ] || { echo "::error::$svc tới được $target — phải bị chặn" >&2; exit 1; }
            done
          done
          r="$(probe browser browser-redis 6379)"; echo "browser → browser-redis:6379: $r"
          [ "$r" = "reach" ] || { echo "::error::browser không tới được browser-redis" >&2; exit 1; }

      - name: Kiểm dữ liệu/bí mật KHÔNG bị tạo lại (app_db_password không đổi)
        run: |
          set -euo pipefail
          pw_after="$(python3 -c "import json;print(json.load(open('${GEN_HARNESS_HOME}/config/secrets.json'))['app_db_password'])")"
          echo "::add-mask::$pw_after"
          if [ "$pw_after" != "${{ steps.before.outputs.pw }}" ]; then
            echo "::error::app_db_password đã ĐỔI sau genh update — bí mật/dữ liệu có vẻ bị tạo lại thay vì giữ nguyên." >&2
            exit 1
          fi
          echo "OK: app_db_password giữ nguyên sau nâng cấp — bí mật/dữ liệu không bị tạo lại. genh version hiện tại:"
          "$GEN_HARNESS_HOME/bin/genh" version --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT"

      - name: genh uninstall --yes (dọn dẹp)
        if: always()
        run: $GEN_HARNESS_HOME/bin/genh uninstall --install-dir "$GEN_HARNESS_HOME" --port "$GH_PORT" --yes || true

      - name: (luôn) In log docker compose (tail 200) để debug
        if: always()
        run: |
          set -euo pipefail
          docker ps -a || true
          for c in $(docker ps -a --format '{{.Names}}' | grep '^gen-harness-' || true); do
            echo "════ $c ════"
            docker logs --tail 200 "$c" 2>&1 || true
          done

  # ── promote ──────────────────────────────────────────────────────────────
  # Nâng tag thành BẢN CHÍNH THỨC (latest) — chỉ khi resolve bảo promote VÀ
  # (e2e-install xanh VÀ e2e-upgrade xanh/bỏ qua), hoặc khi Owner chạy tay
  # với skip_e2e=true (promote tay, có cảnh báo). always() để job vẫn được
  # xét khi e2e-upgrade bị bỏ qua (chưa có bản chính thức cũ hơn).
  # Không bao giờ hạ cấp: latest hiện tại mới hơn thì chỉ cảnh báo.
  promote:
    name: nâng thành bản chính thức (promote ${{ needs.resolve.outputs.tag }})
    runs-on: ubuntu-latest
    needs: [resolve, e2e-install, e2e-upgrade]
    if: always() && needs.resolve.outputs.promote == 'true' && (needs.resolve.outputs.skip_e2e == 'true' || (needs.e2e-install.result == 'success' && (needs.e2e-upgrade.result == 'success' || needs.e2e-upgrade.result == 'skipped')))
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.resolve.outputs.tag }}
      R: ${{ github.repository }}
      SKIP_E2E: ${{ needs.resolve.outputs.skip_e2e }}
    steps:
      - name: Nâng ${{ needs.resolve.outputs.tag }} thành bản chính thức (latest)
        run: |
          set -euo pipefail
          # Bản chính thức hiện tại; rỗng nếu 404 (không dùng `$(… || true)`:
          # khi lỗi HTTP, gh api vẫn in thân JSON lỗi ra stdout).
          latest_official() {
            local t
            if t="$(gh api "repos/$R/releases/latest" --jq .tag_name 2>/dev/null)"; then printf '%s' "$t"; fi
          }
          if [ "$SKIP_E2E" = "true" ]; then
            echo "::warning::PROMOTE TAY — đã bỏ qua E2E cho $TAG (skip_e2e=true). Ghi lý do vào HANDOFF và chạy lại E2E khi GitHub/mạng ổn."
          fi

          before="$(latest_official)"
          echo "releases/latest TRƯỚC: ${before:-<chưa có>}"

          pre="$(gh release view "$TAG" --repo "$R" --json isPrerelease --jq .isPrerelease)"
          if [ "$pre" != "true" ] && [ "$before" = "$TAG" ]; then
            echo "$TAG đã là latest (bản chính thức) — không cần làm gì."
            exit 0
          fi
          case "$TAG" in
            *-*)
              echo "::error::$TAG có hậu tố '-' (bản thử dài hạn) — không được nâng thành bản chính thức. Phát hành bản không hậu tố (tăng VERSION) nếu muốn máy Boss nhận." >&2
              exit 1
              ;;
          esac
          if [ -n "$before" ] && [ "$before" != "$TAG" ] \
            && [ "$(printf '%s\n%s\n' "$before" "$TAG" | sort -V | tail -n1)" = "$before" ]; then
            echo "::warning::bản mới hơn đã là latest ($before), không hạ cấp — $TAG giữ nguyên là bản thử."
            exit 0
          fi

          gh release edit "$TAG" --repo "$R" --prerelease=false --latest

          # API releases/latest có thể trễ vài giây — chờ tối đa 60 giây.
          after=""
          deadline=$((SECONDS + 60))
          while :; do
            after="$(latest_official)"
            if [ "$after" = "$TAG" ] || [ "$SECONDS" -ge "$deadline" ]; then
              break
            fi
            sleep 5
          done
          echo "releases/latest SAU: ${after:-<chưa có>}"
          if [ "$after" != "$TAG" ]; then
            echo "::error::Đã sửa Release $TAG nhưng releases/latest vẫn là '${after:-<chưa có>}' sau 60 giây — kiểm tay: gh release edit $TAG --prerelease=false --latest, rồi gh api repos/$R/releases/latest." >&2
            exit 1
          fi
          {
            echo "### Promote"
            echo "releases/latest: ${before:-<chưa có>} → **$after**"
          } >>"$GITHUB_STEP_SUMMARY"
          echo "OK: $TAG là bản chính thức — máy Boss (install.sh, genh tự cập nhật) sẽ nhận bản này."
